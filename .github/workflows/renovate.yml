name: Renovate

# Self-hosted Renovate for this repository only. The repository config lives in
# renovate.json; the settings below are the global ones a hosted app would own.
on:
  push:
    branches:
      - main
  schedule:
    # Daily so green PRs automerge promptly; new PRs only open inside the
    # schedule:weekly window (Monday before 04:00 Vienna), which 01:00 UTC hits.
    - cron: '0 1 * * *'
  workflow_dispatch:

# Overlapping runs would race on the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # RENOVATE_TOKEN must not be GITHUB_TOKEN: PRs opened with it do not
      # trigger CI, so nothing would ever turn green and automerge.
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
