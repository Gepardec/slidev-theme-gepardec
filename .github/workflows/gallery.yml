name: Gallery

# Publishes gallery.md to GitHub Pages on every push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest push matters; superseded deploys can be dropped.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write # deploy to GitHub Pages
  id-token: write # verify the deployment origin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Slidev emits 404.html alongside index.html, so deep links to a slide survive a reload.
      - name: Build gallery
        run: pnpm build:gallery --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
