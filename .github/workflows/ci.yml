name: CI

# The checks Renovate waits for before it automerges. Anything that would break
# a release or the gallery has to fail here, not on main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: pnpm audit signatures

      - name: Check theme surfaces
        run: pnpm check:surfaces

      - name: Build example
        run: pnpm build

      - name: Build gallery
        run: pnpm build:gallery

  # Checks apm.lock.yaml against apm.yml and the committed .claude/skills bytes.
  # setup-only keeps `apm install` from rewriting the checkout before the audit.
  # --no-drift: the install replay treats the root skills/ folder as the
  # package's skills instead of .apm/skills/, so it reports false drift.
  apm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup APM
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: true
          apm-version: '0.33.0'

      - name: Audit APM lockfile and deployed files
        run: apm audit --ci --no-drift
